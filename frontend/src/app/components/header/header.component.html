<header class="appbar">
  <a class="brand" routerLink="/" aria-label="Home">
    <span class="brand__prompt">&gt;_</span>
    <span class="brand__name">assistant</span>
  </a>

  <nav class="nav">
    <a class="nav__link" routerLink="/chat" routerLinkActive="nav__link--active">chat</a>
    <a class="nav__link" routerLink="/rag" routerLinkActive="nav__link--active">documents</a>
  </nav>

  <button
    class="theme-toggle"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    [title]="themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
  >
    @if (themeService.theme() === 'dark') {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
      </svg>
    }
  </button>
</header>
